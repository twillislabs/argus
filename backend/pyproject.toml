[project]
name = "argus"
version = "1.9.1"
description = "Self-hosted OSINT visualizer: API and collectors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "nats-py>=2.9",
    "cryptography>=43",
    "websockets>=14",
    "anthropic>=1,<2",
    "gtfs-realtime-bindings>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# UP032 would rewrite str.format() calls into f-strings; the project
# style is str.format() everywhere.
# UP030 would drop the explicit {0} indices this project uses.
ignore = ["UP030", "UP032"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
