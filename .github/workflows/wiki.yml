# Publish the documentation (docs-site/docs) to the GitHub wiki on every
# push to main that changes it. scripts/docs_to_wiki.py converts the
# pages; the wiki is replaced wholesale, so edit the docs, not the wiki.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/docs/**'
      - 'docs-site/sidebars.ts'
      - 'scripts/docs_to_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert the docs to wiki pages
        run: python3 scripts/docs_to_wiki.py docs-site "$RUNNER_TEMP/wiki-out"

      - name: Push to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          find . -maxdepth 1 -name '*.md' -delete
          cp "$RUNNER_TEMP"/wiki-out/*.md .
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from docs-site/docs at ${GITHUB_SHA::7}"
          git push origin HEAD
