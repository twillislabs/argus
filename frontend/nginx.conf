# Rendered street map tiles: cached here so each tile is drawn once.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m
                 max_size=2g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=tiles_rate:10m rate=60r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_tokens off;
    # Redirects (for example /docs/x to /docs/x/) keep the browser's host
    # and port: nginx listens on 80 inside the container, not the host port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # Behind a reverse proxy: take the visitor's address from the proxies
    # in ARGUS_TRUSTED_PROXIES only (docker/40-argus-real-ip.sh writes it).
    # $remote_addr is then the visitor, and that's all the API is told.
    include /etc/nginx/argus-real-ip.conf;

    # Map data (borders, labels) and the app's JS and CSS compress well.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    # Also compress API responses (the satellite catalogue is ~4 MB raw).
    gzip_proxied any;

    # One Content-Security-Policy, adjusted per location through $csp.
    # Street tiles come from the local tiles container where a region is
    # installed; NASA GIBS and Esri cover the rest.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov https://server.arcgisonline.com https://tile.googleapis.com; connect-src 'self' https://gibs.earthdata.nasa.gov https://server.arcgisonline.com https://tile.googleapis.com https://wzmedia.dot.ca.gov https://*.skyvdn.com; media-src 'self' blob: https://wzmedia.dot.ca.gov https://*.skyvdn.com https://s3-eu-west-1.amazonaws.com; worker-src 'self' blob:; font-src 'self' data:; frame-src https://www.youtube-nocookie.com https://rumble.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # One address, never what the client sent: the API trusts it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # Self-hosted street map (tileserver-gl in the tiles container). Only
    # the rendered Argus Dark tiles and the region's TileJSON are exposed.
    # The upstream is resolved per request, so nginx starts without it.
    location ~ ^/tiles/(styles/argus-dark/256/\d+/\d+/\d+(@2x)?\.png|data/protomaps\.json)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tiles_upstream http://tiles:8080;
        proxy_pass $tiles_upstream/$1;
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        limit_req zone=tiles_rate burst=200 nodelay;
        add_header X-Cache $upstream_cache_status always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
    }
    location /tiles/ {
        return 404;
    }

    # Docusaurus inlines a small theme script, so the docs allow inline JS.
    location /docs/ {
        set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'";
        try_files $uri $uri/ $uri.html /docs/404.html;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /vendor/ {
        expires 7d;
        try_files $uri =404;
    }

    location /img/ {
        expires 7d;
        try_files $uri =404;
    }

    # Bundled map data: changes only with a new release.
    location /data/ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
